{% extends 'base.html' %}
{% block title %}Post Announcement{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding:40px 16px;">
  <div style="width:100%; max-width:780px;">
    <div class="flex-between mb-24">
      <h1 class="page-title">Post Announcement</h1>
      <a href="{% url 'school_admin_dashboard' %}" class="btn btn-ghost">Cancel</a>
    </div>
    <div class="card">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" style="font-size:1.1rem;">Title</label>
          <input type="text" name="title" class="form-control" placeholder="Announcement title" required
                 style="padding:14px 16px; font-size:1.1rem;">
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:1.1rem;">Message</label>
          <textarea name="body" class="form-control" rows="10"
                    placeholder="Write your school-wide announcement here…" required
                    style="padding:14px 16px; font-size:1.1rem; resize:vertical;"></textarea>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" name="is_pinned" id="pin" style="width:18px; height:18px;">
          <label for="pin" class="form-label" style="margin:0; cursor:pointer; font-size:1.1rem;">Pin this announcement</label>
        </div>
        <button type="submit" class="btn btn-primary" style="padding:12px 36px; font-size:1.1rem;">Post Announcement</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
