{% extends 'base.html' %}
{% block title %}Post Announcement{% endblock %}
{% block content %}
<div style="max-width:560px;">
  <div class="flex-between mb-24">
    <h1 class="page-title">Post Announcement</h1>
    <a href="{% url 'school_admin_dashboard' %}" class="btn btn-ghost">Cancel</a>
  </div>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" placeholder="Announcement title" required>
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea name="body" class="form-control" rows="5"
                  placeholder="Write your school-wide announcement here…" required></textarea>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" name="is_pinned" id="pin" style="width:16px;height:16px;">
        <label for="pin" class="form-label" style="margin:0;cursor:pointer;">Pin this announcement</label>
      </div>
      <button type="submit" class="btn btn-primary">Post Announcement</button>
    </form>
  </div>
</div>
{% endblock %}
