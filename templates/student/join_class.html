{% extends 'base.html' %}
{% block title %}Join a Class{% endblock %}
{% block content %}
<div style="max-width:460px;margin:60px auto;">
  <h1 class="page-title mb-24">Join a Classroom</h1>
  <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px;">
    <p class="text-muted mb-16">Enter the 6-character code given by your teacher.</p>
    <form method="post">{% csrf_token %}
      <div class="form-group">
        {{ form.class_code }}
        {% if form.class_code.errors %}
          <div class="form-error">{{ form.class_code.errors.0 }}</div>
        {% endif %}
      </div>
      <div class="flex gap-8">
        <button type="submit" class="btn btn-primary">Join Classroom</button>
        <a href="{% url 'students:dashboard' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
