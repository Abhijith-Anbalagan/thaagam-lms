{% for assignment in pending_assignments|slice:":4" %}
<div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
    <div class="flex items-start justify-between gap-3">
        <div>
            <h3 class="font-semibold text-slate-900">{{ assignment.title }}</h3>
            <p class="mt-1 text-sm text-slate-500">{{ assignment.classroom.name }}</p>
        </div>
        <span class="rounded-full bg-rose-100 px-3 py-1 text-xs font-semibold text-rose-700">{% if assignment.due_date.year <= 9999 %}{{ assignment.due_date|date:"M j" }}{% else %}—{% endif %}</span>
    </div>
</div>
{% empty %}
<div class="rounded-2xl border border-dashed border-emerald-200 bg-emerald-50 p-6 text-center text-emerald-800">
    <i data-lucide="check-circle-2" class="mx-auto h-8 w-8"></i>
    <p class="mt-3 text-sm font-medium">No upcoming deadlines right now.</p>
</div>
{% endfor %}
<script>lucide.createIcons();</script>
