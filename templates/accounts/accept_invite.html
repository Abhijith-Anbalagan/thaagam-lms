{% extends 'base.html' %}
{% block title %}Accept Invitation{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">EduPlatform</div>
    <p class="auth-subtitle">Invited as <strong>{{ invitation.role|title }}</strong> at <strong>{{ invitation.school.name }}</strong></p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="toast toast-error mb-12">{{ form.non_field_errors }}</div>{% endif %}
      <div class="form-row">
        <div class="form-group"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control" required></div>
      </div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" value="{{ invitation.email }}" class="form-control" disabled></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Set Password</label><input type="password" name="password1" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Confirm</label><input type="password" name="password2" class="form-control" required></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Accept & Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
